services:
  tuxtechblog-mkdocs:
    build:
      context: .
      # dockerfile: mkdocs_blogs.Dockerfile
      dockerfile: blogs.tuxtechlab.Dockerfile
    ports:
      - "${BLOGS_CTR_INTERNAL_PORT}:${BLOGS_CTR_EXTERNAL_PORT}"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 50M
        reservations:
          cpus: '0.5'
          memory: 20M
    volumes:
      - ${PWD}/TuxTechBlogs/:/docs